name: Build & Verify 636mecheri 100% Offline APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_and_audit_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug Offline APK
        run: gradle assembleDebug --stacktrace

      - name: Automated 0%-Network Security Audit Gate (aapt2)
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)
          echo "Using aapt2: $AAPT2"
          echo "=== DECLARED PERMISSIONS IN COMPILED APK ==="
          PERMS=$($AAPT2 dump permissions "$APK_PATH")
          echo "$PERMS"

          FORBIDDEN="INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE|CHANGE_WIFI_STATE|CHANGE_NETWORK_STATE|NEARBY_WIFI_DEVICES|BLUETOOTH|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|READ_PHONE_STATE|NFC|AD_ID|usb\\.host|usb\\.accessory"
          if echo "$PERMS" | grep -E "$FORBIDDEN"; then
            echo "SECURITY GATE FAILED: Forbidden network/USB/tracking permission detected in compiled APK!"
            exit 1
          else
            echo "SECURITY GATE PASSED: 0% Network, 0% Wi-Fi, 0% USB, 0% Tracking verified!"
          fi

      - name: Copy & Print SHA-256 Checksum
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk 636mecheri-v1-offline.apk
          sha256sum 636mecheri-v1-offline.apk | tee 636mecheri-v1-offline.sha256

      - name: Upload Verified 636mecheri APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 636mecheri-v1-offline-apk
          path: |
            636mecheri-v1-offline.apk
            636mecheri-v1-offline.sha256
